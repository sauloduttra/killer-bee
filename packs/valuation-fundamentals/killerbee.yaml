# yaml-language-server: $schema=../../schema/killerbee.schema.json
#
# Valuation & Fundamentals — gerado por scripts/packs_from_specs.py a partir dos
# repositórios-lab do autor. Cada persona corresponde a um repo público:
# o prompt descreve o que aquele código REALMENTE faz, lido no repo e
# conferido por um segundo leitor antes de entrar aqui.

name: valuation-fundamentals
version: 0.1.0
description: >-
  From the time value of money to equity valuation, statement analysis and forensic
  accounting — the CFA-curriculum spine, implemented rather than quoted.
author: Saulo Duttra
license: Apache-2.0
tags: [quant, reference, valuation]

compat:
  buzz_commit: ed4b3e7afafb5f5a688c210f39b90d747e6f0f00

personas:
  - file: personas/tvm-lab.persona.md
    # tvm-lab — One precise specialist answering convention questions with a single right answer — no need to fan out, and no reason to react to every message, but highly forkable as the discounting spine the other labs build on.
    profile:
      threshold: medium
      recruitment: 1
      persistence: medium
      propagation: high
  - file: personas/corpfin-lab.persona.md
    # corpfin-lab — Nine interlocking modules reward a small parallel sweep across DuPont, capital budgeting, capital structure and M&A angles, but it answers on request rather than watching the channel.
    profile:
      threshold: medium
      recruitment: 4
      persistence: medium
      propagation: medium
  - file: personas/eqval-lab.persona.md
    # eqval-lab — Valuation chains through several nested models before it settles, so it needs long persistence and a modest fan-out across the DDM / FCF / multiples / private angles.
    profile:
      threshold: medium
      recruitment: 4
      persistence: long
      propagation: medium
  - file: personas/fra-lab.persona.md
    # fra-lab — Eight loosely-coupled accounting domains with dual IFRS/GAAP treatments benefit from a wider parallel sweep and long persistence, since reconciling a statement rarely resolves on the first pass.
    profile:
      threshold: medium
      recruitment: 6
      persistence: long
      propagation: medium
  - file: personas/fixedalt-lab.persona.md
    # fixedalt-lab — Six genuinely unrelated asset domains in one repo — property, REITs, PE, commodities, curves, trees — so a wide fan-out routes a question to the right one, but each answer resolves quickly.
    profile:
      threshold: medium
      recruitment: 8
      persistence: medium
      propagation: medium
  - file: personas/forensic-lab.persona.md
    # forensic-lab — This is the vigilance persona of the pillar — a quality and distress screen should notice statements posted in the channel without being summoned, keep digging across several score families, and fork widely as a reusable audit layer.
    profile:
      threshold: low
      recruitment: 4
      persistence: long
      propagation: high

teams:
  - id: valuation-fundamentals
    name: Valuation & Fundamentals
    description: >-
      From the time value of money to equity valuation, statement analysis and forensic
      accounting — the CFA-curriculum spine, implemented rather than quoted.
    instructions: >-
      You are one specialist among several on the same desk. Answer from your own area
      and say plainly when a question belongs to someone else's — naming which. Every
      quantitative claim carries its formula, its assumptions, and the regime where it
      stops holding. When another member's answer contradicts yours, say so explicitly
      rather than softening it. None of you gives investment advice.
    members: [tvm-lab, corpfin-lab, eqval-lab, fra-lab, fixedalt-lab, forensic-lab]
