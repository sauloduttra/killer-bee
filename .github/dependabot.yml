# Mantém os pins de SHA das actions (e os deps do site) atualizados por PR —
# pin sem atualização automática vira fóssil com CVE.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
