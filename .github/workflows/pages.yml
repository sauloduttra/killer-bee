name: Deploy Waggle to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo no nível do workflow. `pages: write` e `id-token: write` moram SÓ no
# job deploy — o job build roda `npm ci` (~400 pacotes com script de lifecycle)
# e não tem por que carregar credencial de publicação (auditoria 2026-08-06).
permissions:
  contents: read

# Uma publicação por vez, e a que está em voo não é cancelada — cancelar um
# deploy pela metade deixa o site num estado que ninguém pediu.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions pinadas por SHA de commit (tag em comentário): tag é mutável e uma
# action de terceiro comprometida entraria aqui com as permissões do job.
# SHAs resolvidos via `gh api repos/<owner>/<repo>/commits/<tag>` em 2026-08-06.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O catálogo é gerado pelo CLI Python a partir de packs/, então o job
      # precisa das duas toolchains.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages

      - run: npm ci
        working-directory: site

      - name: Build
        working-directory: site
        env:
          # `configure-pages` resolve o basePath do repositório; sem isso os
          # caminhos quebram quando o site é servido em /<repo>/.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # `base_url` = origin + base_path. A versão anterior passava `origin`
          # cru, e canonical/og:url saíam SEM o /<repo>/ — endereços que 404am
          # (auditoria 2026-08-06, CONFIRMED). O metadataBase precisa carregar o
          # subcaminho porque o Next não injeta basePath em URL de metadata.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Test the exported HTML
        working-directory: site
        env:
          # O teste de integridade de links confere que todo href interno
          # carrega o basePath do deploy — é o teste que pegaria o 404.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node --test tests/rendered-html.test.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
