# P5 do FASE-2: o documento não pode apodrecer em silêncio.
#
# Agendado porque o upstream tem commit diário: toda segunda o verificador
# revalida cada citação `arquivo:linha` do PROTOCOL-NOTES contra o main atual
# do block/buzz. `--strict` é deliberado: DERIVA também falha o job — deriva
# invisível é exatamente o apodrecimento que este job existe para acusar.
#
# Falha ruidosa por construção (lição do gitleaks que varreu zero bytes):
# - clone do upstream falhou → o próprio checkout falha o job;
# - zero citações coletadas → o script sai com 2, nunca "ok" vazio.
name: verify-citations

on:
  schedule:
    - cron: "17 6 * * 1" # segundas 06:17 UTC — horário deslocado para fugir do pico
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: citações vs upstream main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout upstream block/buzz (histórico completo — o pin precisa ser alcançável)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: block/buzz
          path: upstream-buzz
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Revalidar citações (deriva também falha)
        run: >-
          uv run python scripts/verify_citations.py
          --upstream upstream-buzz
          --at HEAD
          --strict
