[project]
name = "killerbee-buzz"
version = "0.1.0"
description = "Killer Bee — catálogo de personas e agent teams entre comunidades Buzz"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# pyyaml é a única dependência de runtime, e existe por um motivo específico:
# os .persona.md usam frontmatter YAML porque esse é o formato NATIVO do Buzz,
# e manter compatibilidade byte a byte com o formato deles vale uma dependência.
# (Os scripts de scripts/ continuam stdlib-only e rodam com --no-project.)
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    # Laço explícito é permitido e às vezes preferido: em código numérico auditável, o
    # laço costuma ser mais claro que a comprehension aninhada. Ver §3 dos padrões.
    "SIM108",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
